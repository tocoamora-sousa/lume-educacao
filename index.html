function normTxt(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function tentarResolverMatematica(raw, norm) {
  const mPct = norm.match(/(\d+(?:[.,]\d+)?)\s*%\s*de\s*(\d+(?:[.,]\d+)?)/);
  if (mPct) {
    const p = parseFloat(mPct[1].replace(',', '.')), v = parseFloat(mPct[2].replace(',', '.'));
    const res = (p / 100) * v;
    const fmt = n => Number.isInteger(n) ? n.toLocaleString('pt-BR') : n.toLocaleString('pt-BR', { maximumFractionDigits: 4 });
    return `<strong>Cálculo de Porcentagem passo a passo 🧮</strong><br>
      1) <code>${fmt(p)}% = ${(p/100).toString().replace('.',',')}</code><br>
      2) <code>${(p/100).toString().replace('.',',')} × ${fmt(v)} = <strong>${fmt(res)}</strong></code><br>
      ✨ Com desconto de ${fmt(p)}%: <strong>${fmt(v - res)}</strong> · Com acréscimo: <strong>${fmt(v + res)}</strong>.`;
  }
  const mBha = norm.match(/a\s*=\s*(-?\d+(?:[.,]\d+)?).*b\s*=\s*(-?\d+(?:[.,]\d+)?).*c\s*=\s*(-?\d+(?:[.,]\d+)?)/);
  if (mBha) {
    const a = parseFloat(mBha[1].replace(',', '.')), b = parseFloat(mBha[2].replace(',', '.')), c = parseFloat(mBha[3].replace(',', '.'));
    if (a === 0) return 'Se <strong>a = 0</strong>, a equação é do 1º grau (bx + c = 0), não usa Bhaskara!';
    const delta = b*b - 4*a*c;
    if (delta < 0) return `<strong>Bhaskara 📐</strong><br>Δ = (${b})² − 4·(${a})·(${c}) = <strong>${delta}</strong>. Como Δ < 0, não há raízes reais.`;
    const r = Math.sqrt(delta), x1 = (-b + r)/(2*a), x2 = (-b - r)/(2*a);
    return `<strong>Resolução por Bhaskara 📐</strong><br>Δ = <strong>${delta}</strong> (√Δ = ${Number(r.toFixed(2))})<br>x' = <strong>${Number(x1.toFixed(2))}</strong> · x'' = <strong>${Number(x2.toFixed(2))}</strong>`;
  }
  const limpo = raw.replace(/quanto\s+[eé]|calcule|resolva|\?/gi, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '.').trim();
  if (/^[0-9+\-*/().\s]+$/.test(limpo) && /[+\-*/]/.test(limpo) && /\d/.test(limpo)) {
    try {
      const val = Function('"use strict"; return (' + limpo + ')')();
      if (typeof val === 'number' && isFinite(val)) {
        const resFmt = Number.isInteger(val) ? val.toLocaleString('pt-BR') : val.toLocaleString('pt-BR', { maximumFractionDigits: 4 });
        return `<strong>Resultado 🧮</strong><br><code>${limpo} = <strong>${resFmt}</strong></code>`;
      }
    } catch(e) {}
  }
  return null;
}

async function perguntarGeminiReal(raw) {
  const key = (STATE.geminiKey || '').trim();
  if (!key) return null;

  // Monta histórico recente (últimas 6 mensagens) para conversa contínua real
  const historico = STATE.chatMsgs.slice(-6).map(m => ({
    role: m.role === 'user' ? 'user' : 'model',
    parts: [{ text: m.text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() }]
  }));
  const sistema = `Você é a Lume IA, tutora oficial 24h da plataforma Lume ENEM (Feira de Santana, Bahia). O estudante se chama ${STATE.nomeAluno} e quer passar em ${STATE.cursoAlvo}. Responda em português do Brasil, de forma jovem, clara, empática e precisa (máximo 160 palavras), usando tópicos curtos quando ajudar. Se for pergunta sobre ENEM (regras, o que reprova/elimina, redação, TRI, SISU, matérias), dê a resposta exata e didática.`;

  const modelos = ['gemini-2.5-flash', 'gemini-2.0-flash'];
  for (const mod of modelos) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent?key=${encodeURIComponent(key)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sistema }] },
          contents: [...historico, { role: 'user', parts: [{ text: raw }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 450 }
        })
      });
      if (!res.ok) continue;
      const data = await res.json();
      const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (txt) {
        return txt
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/\n/g, '<br>');
      }
    } catch (e) {}
  }
  showToast('Não foi possível conectar ao Gemini — verifique sua chave na configuração. Usando motor local.');
  return null;
}

function avaliarRedacaoDinamica(texto) {
  const t = texto.trim(), n = normTxt(t);
  const palavras = t ? t.split(/\s+/).length : 0;
  const paragrafos = t.split(/\n+/).filter(p => p.trim().length > 20).length;
  const conectivos = ['portanto', 'contudo', 'todavia', 'entretanto', 'alem disso', 'dessa forma', 'nesse sentido', 'logo', 'assim', 'outrossim', 'ademais', 'em suma', 'primeiramente', 'consequentemente'];
  const achadosCon = conectivos.filter(c => n.includes(c));
  const temAgente = ['ministerio', 'governo', 'estado', 'escola', 'escolas', 'mec', 'poder publico', 'sociedade', 'midia', 'prefeitura'].some(a => n.includes(a));
  const temMeio = ['por meio de', 'atraves de', 'mediante', 'via'].some(m => n.includes(m));
  const temFim = ['a fim de', 'para que', 'com o intuito de', 'com o objetivo de', 'visando'].some(f => n.includes(f));
  const temRep = /(constituicao|paulo freire|bauman|ibge|milton santos|onu|aristoteles|kant|durkheim|dados|pesquisa|estatuto)/.test(n);

  const c1 = palavras >= 140 ? 180 : palavras >= 70 ? 140 : 100;
  const c2 = (temRep ? 160 : 120) + (paragrafos >= 3 ? 40 : 0);
  const c3 = paragrafos >= 4 ? 180 : paragrafos >= 2 ? 140 : 100;
  const c4 = achadosCon.length >= 4 ? 200 : achadosCon.length >= 2 ? 160 : achadosCon.length >= 1 ? 120 : 80;
  const c5 = 40 + (temAgente ? 40 : 0) + (temMeio ? 40 : 0) + (temFim ? 40 : 0) + (palavras >= 150 ? 40 : 0);
  return {
    total: c1 + c2 + c3 + c4 + c5, palavras, paragrafos,
    comps: [
      { c: 'C1 · Norma Culta', n: c1, cor: 'lav', desc: palavras >= 140 ? 'Boa extensão textual e registro formal.' : 'Amplie o texto (meta ENEM: 180 a 300 palavras).' },
      { c: 'C2 · Tema e Repertório', n: c2, cor: 'mint', desc: temRep ? 'Repertório sociocultural produtivo detectado!' : 'Adicione um repertório (Constituição, IBGE, Paulo Freire ou Milton Santos).' },
      { c: 'C3 · Projeto de Texto', n: c3, cor: 'sky', desc: `${paragrafos} parágrafo(s) desenvolvido(s) — ideal: 4 parágrafos.` },
      { c: 'C4 · Coesão Textual', n: c4, cor: 'butter', desc: achadosCon.length ? `Conectivos: ${achadosCon.join(', ')}.` : 'Use conectivos entre parágrafos (Além disso, Contudo, Portanto).' },
      { c: 'C5 · Proposta de Intervenção', n: c5, cor: 'rose', desc: `Agente: ${temAgente?'✓':'falta'} · Meio: ${temMeio?'✓':'falta'} · Finalidade: ${temFim?'✓':'falta'}.` },
    ]
  };
}

}
function getScenarioEffectForItem(item, cen) {
  const hit = DATA.cen_backlog.find(x => x.cenario === cen && x.id === item.id);
  if (hit) return hit.acao;
  if (cen === 'C3' && item.epico === DATA.ep_ids.ia) return 'EXCLUIR';
  if (cen === 'C3' && item.release === 'R3' && item.prio === 'COULD') return 'EXCLUIR';
  if (cen === 'C5' && item.epico === DATA.ep_ids.ia) return 'TERCEIRIZADO';
  return null;
}
function getEpicItems(epId) {
  let base = DATA.backlog.filter(i => epId === 'TODOS' ? true : i.epico === epId);
  const novosCen = DATA.cen_backlog
    .filter(x => x.cenario === STATE.scenario && x.acao === 'INCLUIR' && (epId === 'TODOS' || x.epico === epId))
    .map(x => ({
      id: x.id, epico: x.epico, tipo: 'HISTORIA', titulo: x.titulo, pontos: x.pontos, prio: 'MUST',
      release: x.release, origem: 'CENARIO_' + STATE.scenario, sprint: 'Futura', solicitante: null,
      status_30_10: null, status_13_11: 'A_FAZER', dt_criacao: '2026-11-16', dt_inicio: null, dt_conc: null, existe_30_10: false, scenarioTag: 'INCLUIR'
    }));
  return [...base, ...novosCen];
}
function getScreenStatus(tela) {
  if (tela.id === 'T14') return { label: 'Painel PMO', cls: 'bg-navy text-gold', pct: 100 };
  if (STATE.scenario === 'C3' && tela.epico === DATA.ep_ids.ia) return { label: 'Cortado no C3', cls: 'bg-rosesoft-100 text-rosesoft-600', pct: 0, cut: true };
  if (STATE.scenario === 'C5' && tela.epico === DATA.ep_ids.ia) return { label: 'API Mercado (C5)', cls: 'bg-lav-100 text-lav-700', pct: 100, swapped: true };
  const items = DATA.backlog.filter(i => i.epico === tela.epico && getItemStatusAtDate(i, STATE.date) !== 'NAO_CRIADO');
  if (!items.length) return { label: 'Planejado', cls: 'bg-slate-100 text-muted', pct: 0 };
  const conc = items.filter(i => getItemStatusAtDate(i, STATE.date) === 'CONCLUIDO').length;
  const pct = Math.round((conc / items.length) * 100);
  if (pct === 100) return { label: 'Entregue', cls: 'bg-mint-100 text-mint-600', pct };
  if (pct > 0 || items.some(i => ['EM_ANDAMENTO', 'EM_REVISAO', 'EM_TESTE'].includes(getItemStatusAtDate(i, STATE.date)))) {
    return { label: `Em andamento · ${pct}%`, cls: 'bg-butter-100 text-butter-600', pct };
  }
  return { label: 'Planejado', cls: 'bg-slate-100 text-muted', pct: 0 };
}
function getScenarioBadgeForScreen(tela) {
  if (tela.id === 'T14') return null;
  if (STATE.scenario === 'C3' && tela.epico === DATA.ep_ids.ia) return { txt: 'CORTADO (C3)', cls: 'bg-rosesoft-500 text-white' };
  if (STATE.scenario === 'C3' && tela.release === 'R3') return { txt: 'SEM COULD (C3)', cls: 'bg-peach-500 text-white' };
  if (STATE.scenario === 'C5' && tela.epico === DATA.ep_ids.ia) return { txt: 'API MERCADO (C5)', cls: 'bg-lav-600 text-white' };
  if (STATE.scenario === 'C4' && DATA.cen_backlog.some(x => x.cenario === 'C4' && x.acao === 'INCLUIR' && x.epico === tela.epico)) return { txt: '+ 2ª PRAÇA (C4)', cls: 'bg-skysoft-500 text-white' };
  if (STATE.scenario === 'C6' && (tela.release === 'R1' || tela.release === 'R2')) return { txt: 'ONDA 1 PILOTO (C6)', cls: 'bg-mint-500 text-white' };
  return null;
}
function hasDirectRequests(tela) {
  if (tela.id === 'T14') return 0;
  return DATA.backlog.filter(i => i.epico === tela.epico && i.origem === 'PEDIDO_DIRETO' && getItemStatusAtDate(i, STATE.date) !== 'NAO_CRIADO').length;
}

function applyDarkClass() {
  document.body.classList.toggle('dark', !!STATE.darkMode);
}
function toggleDarkMode() {
  STATE.darkMode = !STATE.darkMode;
  try { localStorage.setItem('lume_dark_mode', STATE.darkMode ? '1' : '0'); } catch(e) {}
  applyDarkClass();
  render();
  showToast(STATE.darkMode ? 'Modo Escuro ativado 🌙' : 'Modo Claro ativado ☀️');
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span class="w-2 h-2 rounded-full bg-mint-500"></span><span>${msg}</span>`;
  el.classList.remove('hidden');
  clearTimeout(window._t);
  window._t = setTimeout(() => el.classList.add('hidden'), 3200);
}
function openModal(title, html) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  const m = document.getElementById('modal-box');
  m.classList.remove('hidden'); m.classList.add('flex');

}
function closeModal() { const m = document.getElementById('modal-box'); m.classList.add('hidden'); m.classList.remove('flex'); }
function goScreen(id) { STATE.screen = id; STATE.mobileMenuOpen = false; render(); const sc = document.getElementById('main-scroll'); if (sc) sc.scrollTop = 0; }
function setDate(d) { STATE.date = d; render(); showToast('Data do projeto atualizada para ' + d); }
function setScenario(c) { STATE.scenario = c; render(); const o = DATA.cenarios.find(x => x.id === c); showToast(`Cenário ${c}: ${o ? o.nome : ''}`); }
function setDevice(m) { STATE.device = m; render(); }
function togglePureMode() { STATE.pureAppMode = !STATE.pureAppMode; render(); showToast(STATE.pureAppMode ? 'Modo App Puro ativado' : 'Controles PMO visíveis'); }

function toggleDrawer(open, customTelaId = null) {
  const ov = document.getElementById('drawer-overlay'), dr = document.getElementById('backlog-drawer');
  if (open) {
    const tid = customTelaId || STATE.screen;
    const tela = DATA.telas.find(t => t.id === tid) || DATA.telas[0];
    const ep = DATA.epicos.find(e => e.id === tela.epico);
    document.getElementById('drawer-title').textContent = `${tela.id} · ${tela.nome}`;
    const items = getEpicItems(tela.epico);
    const visiveis = items.filter(i => i.scenarioTag === 'INCLUIR' || getItemStatusAtDate(i, STATE.date) !== 'NAO_CRIADO');
    const conc = visiveis.filter(i => !i.scenarioTag && getItemStatusAtDate(i, STATE.date) === 'CONCLUIDO').length;
    const diretos = visiveis.filter(i => i.origem === 'PEDIDO_DIRETO').length;
    const pts = visiveis.reduce((s, i) => s + i.pontos, 0);

    let html = `
      <div class="p-3.5 rounded-2xl bg-white border border-slate-200/80 text-xs space-y-1.5 shadow-sm">
        <div class="font-bold text-ink">${ep ? `${ep.id} — ${ep.nome}` : 'Todos os 8 Épicos (EP01 a EP08)'}</div>
        <div class="text-muted">Release: <strong class="text-ink">${tela.release}</strong> · Corte: <strong class="text-ink">${STATE.date}</strong> · Cenário: <strong class="text-lav-600">${STATE.scenario}</strong></div>
        <div class="flex flex-wrap gap-1.5 pt-1">
          <span class="px-2 py-0.5 rounded-full bg-mint-100 text-mint-600 font-bold text-[11px]">${conc}/${visiveis.length} concluídos (${pts} pts)</span>
          ${diretos > 0 ? `<span class="px-2 py-0.5 rounded-full bg-peach-100 text-peach-600 font-bold text-[11px]">⚠ ${diretos} pedido(s) direto(s) sem SM</span>` : ''}
        </div>
      </div>`;
    visiveis.forEach(it => {
      const st = it.scenarioTag === 'INCLUIR' ? 'NOVO_CENARIO' : getItemStatusAtDate(it, STATE.date);
      const ef = it.scenarioTag || getScenarioEffectForItem(it, STATE.scenario);
      const isSC = it.origem === 'PEDIDO_DIRETO';
      const stCls = st === 'CONCLUIDO' ? 'bg-mint-100 text-mint-600' : st === 'NOVO_CENARIO' ? 'bg-skysoft-100 text-skysoft-600' : ['EM_ANDAMENTO', 'EM_TESTE', 'EM_REVISAO'].includes(st) ? 'bg-butter-100 text-butter-600' : 'bg-slate-100 text-muted';
      html += `
        <div class="p-3 rounded-2xl bg-white border ${ef==='EXCLUIR'?'border-rosesoft-500/50 bg-rosesoft-50/40':isSC?'border-peach-400/60 bg-peach-50/30':'border-slate-200/70'}">
          <div class="flex items-center justify-between gap-1.5 mb-1">
            <div class="flex items-center gap-1.5"><span class="font-mono text-xs font-bold text-ink">${it.id}</span>${it.sprint ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md ${it.sprint==='S14'?'bg-lav-600 text-white':'bg-lav-50 text-lav-700'}">${it.sprint}</span>` : ''}</div>
            <div class="flex items-center gap-1"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-slate-100 text-muted">${it.release}</span><span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-peach-50 text-peach-600">${it.pontos}pts</span><span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md ${stCls}">${st}</span></div>
          </div>
          <div class="text-xs font-semibold text-ink ${ef==='EXCLUIR'?'line-through text-rosesoft-600':''}">${it.titulo}</div>
          <div class="mt-1.5 flex flex-wrap items-center justify-between gap-1 text-[10px] text-muted">
            <span>${it.tipo} · ${it.prio} ${isSC ? `<strong class="text-peach-600">· PEDIDO DIRETO ${it.solicitante ? '('+it.solicitante+')' : ''}</strong>` : `· ${it.origem}`}</span>
            ${ef ? `<span class="font-bold px-1.5 py-0.5 rounded ${ef==='EXCLUIR'?'bg-rosesoft-100 text-rosesoft-600':ef==='INCLUIR'?'bg-skysoft-100 text-skysoft-600':'bg-lav-100 text-lav-700'}">${ef} (${STATE.scenario})</span>` : ''}
          </div>
        </div>`;
    });
    document.getElementById('drawer-content').innerHTML = html;
    ov.classList.remove('hidden'); dr.classList.remove('translate-x-[110%]');
  } else {
    ov.classList.add('hidden'); dr.classList.add('translate-x-[110%]');
  }
}

    // --------------------------------------------------------------------------

          ${atrasadas > 0 ? `

                  </div>`;

    // T03
    case 'T03': {

      const filtradas = AULAS_CATALOGO.filter(a => (STATE.vidArea === 'Todas' || a.area === STATE.vidArea) && a.titulo.toLowerCase().includes(STATE.vidBusca.toLowerCase()));
      return pill + `

            <div class="relative w-full sm:w-64"><i data-lucide="search" class="w-4 h-4 text-muted absolute left-3.5 top-2.5"></i><input value="${STATE.vidBusca}" oninput="STATE.vidBusca=this.value; render()" placeholder="Buscar tema..." class="w-full pl-9 pr-3.5 py-2 rounded-full bg-white border border-slate-200 text-xs" /></div>

          <div class="flex flex-wrap gap-1.5">${areas.map(a => `<button onclick="STATE.vidArea='${a}'; render()" class="px-3.5 py-1.5 rounded-full text-xs font-bold ${STATE.vidArea===a ? 'bg-lav-600 text-white shadow-sm' : 'bg-white text-muted border border-slate-200/80'}">${a}</button>`).join('')}</div>
          <div class="grid ${g3} gap-4">
            ${filtradas.map(a => {
              const p = PASTEL_STYLES[a.cor] || PASTEL_STYLES.lav;
              return `
                <div class="card-mlp card-hover overflow-hidden flex flex-col justify-between">
                  <div class="p-4 ${p.bg} flex flex-col justify-between h-32">
                    <div class="flex items-center justify-between"><span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-white text-ink shadow-sm">${a.area}</span><span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/80 text-mint-600 flex items-center gap-1"><i data-lucide="wifi" class="w-3 h-3"></i> ${a.mb240} MB</span></div>
                    <div class="flex items-end justify-between"><span class="text-xs font-bold text-ink/70">${a.dur}</span><button onclick="abrirAula(${a.id})" class="w-10 h-10 rounded-full bg-lav-600 hover:bg-lav-700 text-white flex items-center justify-center shadow-md"><i data-lucide="play" class="w-4 h-4 fill-white ml-0.5"></i></button></div>
                  </div>
                  <div class="p-4 space-y-2.5"><div class="font-display font-bold text-sm text-ink leading-snug">${a.titulo}</div><div class="text-xs text-muted">${a.prof}</div><div class="flex items-center gap-2 pt-1"><div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${p.bar} rounded-full" style="width:${a.progresso}%"></div></div><span class="text-[10px] font-bold text-muted">${a.progresso}%</span></div></div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    // T04
    case 'T04': {
      const a = STATE.aulaAtual;
      const mbAtual = STATE.playerQual === '240p' ? a.mb240 : STATE.playerQual === '360p' ? Math.round(a.mb240 * 1.9) : a.mb720;
      const min = String(Math.floor(STATE.playerSec / 60)).padStart(2, '0'), seg = String(STATE.playerSec % 60).padStart(2, '0');
      return pill + `
        <div class="fade-up space-y-5">
          <div class="card-mlp overflow-hidden">

              <span class="absolute top-4 left-4 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-mint-100 text-[11px] font-bold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-mint-500"></span> ${STATE.playerQual} · ${mbAtual} MB</span>

              <div class="mt-4 text-center max-w-md"><div class="font-display font-bold text-sm sm:text-base">${a.titulo}</div><div class="text-xs text-lav-200 mt-0.5">${a.prof} · ${min}:${seg} / ${a.dur}</div></div>
            </div>
            <div class="p-4 bg-white flex flex-wrap items-center justify-between gap-2.5">
              <div class="flex items-center gap-1.5"><span class="text-xs font-semibold text-muted mr-1">Qualidade:</span>${['240p', '360p', '720p'].map(q => `<button onclick="STATE.playerQual='${q}'; render(); showToast('Qualidade: ${q}')" class="px-3 py-1 rounded-full text-xs font-bold ${STATE.playerQual===q ? 'bg-mint-500 text-white' : 'bg-canvas text-muted'}">${q}${q==='240p'?' · Leve':''}</button>`).join('')}</div>
              <div class="flex items-center gap-1">${['1x', '1.25x', '1.5x', '2x'].map(v => `<button onclick="STATE.playerVel='${v}'; render()" class="px-2.5 py-1 rounded-full text-xs font-bold ${STATE.playerVel===v ? 'bg-lav-600 text-white' : 'bg-canvas text-muted'}">${v}</button>`).join('')}</div>
              <button onclick="STATE.aulaOffline=!STATE.aulaOffline; render(); showToast(STATE.aulaOffline?'Aula salva offline!':'Download removido')" class="px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 ${STATE.aulaOffline ? 'bg-mint-100 text-mint-600' : 'bg-lav-50 text-lav-700'}"><i data-lucide="${STATE.aulaOffline?'check':'download'}" class="w-3.5 h-3.5"></i> ${STATE.aulaOffline ? 'Salva Offline' : 'Baixar ('+a.mb240+' MB)'}</button>
            </div>
          </div>
          <div class="grid ${g2} gap-4">
            <div class="p-5 rounded-3xl bg-mint-50 border border-mint-100 space-y-1.5"><div class="font-display font-bold text-sm text-mint-600 flex items-center gap-1.5"><i data-lucide="leaf" class="w-4 h-4"></i> Economia Real de Internet</div><p class="text-xs text-ink/80 leading-relaxed">No modo <strong>240p</strong>, esta aula consome só <strong>${a.mb240} MB</strong> — economia de <strong>${Math.round((1 - a.mb240/a.mb720)*100)}%</strong> sobre o HD (${a.mb720} MB).</p></div>
            <div class="card-mlp p-4 space-y-2"><div class="font-display font-bold text-xs text-ink flex justify-between"><span>Caderno da Aula</span><span class="text-[10px] text-mint-600">Salvo automaticamente</span></div><textarea oninput="STATE.notaAula=this.value" rows="3" class="w-full rounded-2xl bg-canvas border border-slate-200 p-3 text-xs">${STATE.notaAula}</textarea></div>
          </div>
        </div>`;
    }

    // T05
    case 'T05': {
      const listaQ = STATE.qAreaFiltro === 'Todas' ? QUESTOES : QUESTOES.filter(x => x.area === STATE.qAreaFiltro);
      const q = listaQ[STATE.qIdx % listaQ.length] || QUESTOES[0];
      const p = PASTEL_STYLES[q.cor] || PASTEL_STYLES.lav;
      return pill + `
        <div class="fade-up space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap gap-1.5">${['Todas', 'Matemática', 'Natureza', 'Humanas', 'Linguagens'].map(ar => `<button onclick="STATE.qAreaFiltro='${ar}'; STATE.qIdx=0; STATE.qSel=null; STATE.qChecked=false; render()" class="px-3 py-1 rounded-full text-xs font-bold ${STATE.qAreaFiltro===ar?'bg-lav-600 text-white':'bg-white text-muted border border-slate-200/80'}">${ar}</button>`).join('')}</div>
            <span class="px-3 py-1 rounded-full bg-mint-50 border border-mint-100 text-mint-600 text-xs font-bold">Acertos: ${STATE.qAcertos}/${STATE.qRespondidas}</span>
          </div>
          <div class="card-mlp p-6 space-y-5">
            <div class="flex items-center justify-between"><span class="px-3 py-1 rounded-full text-xs font-bold ${p.chip}">${q.area}</span><span class="text-xs font-semibold text-muted">${q.ano} · ${(STATE.qIdx % listaQ.length) + 1}/${listaQ.length}</span></div>
            <p class="text-sm sm:text-base font-medium text-ink leading-relaxed">${q.enunciado}</p>
            <div class="space-y-2.5">
              ${q.alts.map((alt, i) => {
                let cls = 'bg-canvas border-transparent hover:border-lav-300 text-ink';
                if (STATE.qChecked) {
                  if (i === q.correta) cls = 'bg-mint-50 border-mint-500 text-mint-600 font-bold';
                  else if (i === STATE.qSel) cls = 'bg-rosesoft-50 border-rosesoft-500 text-rosesoft-600';
                } else if (STATE.qSel === i) cls = 'bg-lav-50 border-lav-500 text-lav-700 font-bold';
                return `<button onclick="if(!STATE.qChecked){STATE.qSel=${i}; render();}" class="w-full text-left px-4 py-3.5 rounded-2xl border text-xs sm:text-sm transition ${cls}">${alt}</button>`;
              }).join('')}
            </div>
            <div class="flex flex-wrap items-center gap-2.5 pt-1">
              <button onclick="responderQuestao('${q.id}')" ${STATE.qChecked || STATE.qSel===null ? 'disabled' : ''} class="px-6 py-2.5 rounded-full bg-lav-600 disabled:opacity-35 text-white font-bold text-xs shadow-sm">Conferir</button>
              <button onclick="proximaQuestao()" class="px-5 py-2.5 rounded-full bg-canvas text-ink font-bold text-xs">Próxima →</button>
              <button onclick="levarQuestaoParaIA('${q.id}')" class="ml-auto px-4 py-2 rounded-full bg-lav-50 text-lav-700 font-bold text-xs flex items-center gap-1"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Explicar na Lume IA</button>
            </div>
            ${STATE.qChecked ? `<div class="p-4 rounded-2xl ${STATE.qSel===q.correta?'bg-mint-50 border border-mint-100':'bg-butter-50 border border-butter-100'} text-xs leading-relaxed"><div class="font-display font-bold text-sm mb-1 ${STATE.qSel===q.correta?'text-mint-600':'text-butter-600'}">${STATE.qSel===q.correta ? 'Mandou bem! Resposta correta ✨ (+25 XP)' : 'Quase lá! Veja a resolução comentada:'}</div><p class="text-ink">${q.comentario}</p></div>` : ''}
          </div>
        </div>`;
    }

    // T06
    case 'T06': {
      const h = String(Math.floor(STATE.simSec / 3600)).padStart(2, '0'), m = String(Math.floor((STATE.simSec % 3600) / 60)).padStart(2, '0'), s = String(STATE.simSec % 60).padStart(2, '0');
      const sq = SIMULADO_QS[STATE.simQIdx];
      const acertosSim = SIMULADO_QS.filter(q => STATE.simAns[q.n] === q.ok).length;
      const mediaTri = STATE.simDone ? (560 + acertosSim * 58) : 712;
      return pill + `
        <div class="fade-up space-y-5">
          <div class="rounded-[28px] p-5 bg-gradient-to-r from-lav-50 via-skysoft-50 to-butter-50 border border-lav-100 flex flex-wrap items-center justify-between gap-3">
            <div><span class="text-[11px] font-bold text-lav-600 uppercase tracking-wide">Mini-Simulado Real · 5 Áreas ENEM</span><h2 class="font-display font-extrabold text-xl text-ink mt-0.5">Simulado Cronometrado & Nota TRI</h2></div>
            <div class="flex items-center gap-2"><div id="sim-clock" class="font-mono text-lg font-extrabold bg-white px-4 py-2 rounded-2xl border border-lav-200 text-lav-700 shadow-sm">${h}:${m}:${s}</div><button onclick="toggleSimulado()" class="px-4 py-2.5 rounded-2xl bg-lav-600 text-white font-bold text-xs">${STATE.simRunning ? 'Pausar' : 'Iniciar'}</button></div>
          </div>
          <div class="grid ${g2} gap-5">
            <div class="card-mlp p-5 space-y-4">
              <div class="flex items-center justify-between">
                <div class="flex gap-1.5">${SIMULADO_QS.map((q, i) => `<button onclick="STATE.simQIdx=${i}; render()" class="w-8 h-8 rounded-full text-xs font-bold ${STATE.simQIdx===i?'bg-lav-600 text-white':STATE.simAns[q.n]?'bg-lav-100 text-lav-700':'bg-canvas text-muted'}">${q.n}</button>`).join('')}</div>
                <span class="text-xs font-bold text-lav-600">${sq.area}</span>
              </div>
              <div class="text-xs sm:text-sm font-semibold text-ink leading-relaxed">${sq.n}. ${sq.txt}</div>
              <div class="space-y-2">
                ${sq.alts.map(a => {
                  const l = a[0], sel = STATE.simAns[sq.n] === l;
                  let cls = sel ? 'bg-lav-50 border-lav-500 text-lav-700 font-bold' : 'bg-canvas border-transparent text-ink';
                  if (STATE.simDone) { if (l === sq.ok) cls = 'bg-mint-50 border-mint-500 text-mint-600 font-bold'; else if (sel) cls = 'bg-rosesoft-50 border-rosesoft-500 text-rosesoft-600'; }
                  return `<button onclick="if(!STATE.simDone){STATE.simAns[${sq.n}]='${l}'; render();}" class="w-full text-left px-3.5 py-2.5 rounded-2xl border text-xs transition ${cls}">${a}</button>`;
                }).join('')}
              </div>
              <div class="flex gap-2">
                ${STATE.simQIdx < 4 ? `<button onclick="STATE.simQIdx++; render()" class="flex-1 py-2.5 rounded-full bg-canvas text-ink font-bold text-xs">Próxima →</button>` : ''}
                <button onclick="finalizarSimulado()" class="flex-1 py-2.5 rounded-full bg-mint-500 text-white font-bold text-xs">${STATE.simDone ? 'Refazer' : 'Entregar & Calcular TRI'}</button>
              </div>
              ${STATE.simDone ? `<div class="p-3 rounded-2xl bg-mint-50 text-mint-600 text-xs font-bold">Resultado: ${acertosSim}/5 acertos · Nota TRI: ${mediaTri} pts!</div>` : ''}
            </div>
            <div class="card-mlp p-5"><div class="flex justify-between items-center mb-3"><h3 class="font-display font-bold text-sm text-ink">Nota TRI por Área</h3><span class="px-3 py-1 rounded-full bg-lav-50 text-lav-700 text-xs font-extrabold">Média ${mediaTri} pts</span></div><div class="h-60"><canvas id="chart-tri"></canvas></div></div>
          </div>
        </div>`;
    }

    // T07
    case 'T07': {
      const compsFixas = [
        { c: 'C1 · Norma Culta', n: 180, cor: 'lav', desc: 'Excelente domínio gramatical; atenção leve à crase no 2º parágrafo.' },
        { c: 'C2 · Tema e Repertório', n: 200, cor: 'mint', desc: 'Repertório produtivo (Paulo Freire + IBGE) bem articulado.' },
        { c: 'C3 · Argumentação', n: 180, cor: 'sky', desc: 'Projeto de texto consistente; aprofunde o dado de conectividade rural.' },
        { c: 'C4 · Coesão Textual', n: 180, cor: 'butter', desc: 'Ótima variedade de operadores argumentativos.' },
        { c: 'C5 · Proposta de Intervenção', n: 180, cor: 'rose', desc: 'Trouxe agente, ação, meio e finalidade; faltou detalhar o agente.' },
      ];
      const palavras = STATE.redTexto.trim() ? STATE.redTexto.trim().split(/\s+/).length : 0;
      const av = STATE.redAvaliacao;
      return pill + `
        <div class="fade-up space-y-4">
          <div class="inline-flex bg-white p-1 rounded-full border border-slate-200/80 shadow-sm">
            <button onclick="STATE.redTab='corrigida'; render()" class="px-4 py-1.5 rounded-full text-xs font-bold ${STATE.redTab==='corrigida'?'bg-lav-600 text-white':'text-muted'}">Última Corrigida (920)</button>
            <button onclick="STATE.redTab='enviar'; render()" class="px-4 py-1.5 rounded-full text-xs font-bold ${STATE.redTab==='enviar'?'bg-lav-600 text-white':'text-muted'}">+ Escrever & Pré-Avaliar</button>
          </div>
          ${STATE.redTab === 'corrigida' ? `
            <div class="grid ${g2} gap-5">
              <div class="card-mlp p-5 space-y-3.5">
                <div class="flex items-center justify-between gap-3"><div><span class="px-2.5 py-0.5 rounded-full bg-mint-100 text-mint-600 text-[10px] font-bold">CORRIGIDA EM 42H (META ≤ 3 DIAS)</span><h3 class="font-display font-bold text-base text-ink mt-1.5">Inclusão digital no interior do Brasil</h3></div><div class="w-16 h-16 rounded-3xl bg-gradient-to-br from-mint-500 to-skysoft-500 text-white flex flex-col items-center justify-center shadow-md shrink-0"><span class="font-display font-extrabold text-xl leading-none">920</span><span class="text-[9px]">de 1000</span></div></div>
                <div class="space-y-2.5">${compsFixas.map(x => `<div class="p-3 rounded-2xl ${PASTEL_STYLES[x.cor].bg}"><div class="flex justify-between text-xs font-bold text-ink"><span>${x.c}</span><span>${x.n}/200</span></div><div class="w-full h-1.5 bg-white/80 rounded-full my-1.5"><div class="h-full ${PASTEL_STYLES[x.cor].bar} rounded-full" style="width:${x.n/2}%"></div></div><div class="text-[11px] text-ink/75">${x.desc}</div></div>`).join('')}</div>
              </div>
              <div class="card-mlp p-5 space-y-3.5"><h3 class="font-display font-bold text-sm text-ink">Folha Comentada pela Banca</h3><div class="p-4 rounded-2xl bg-butter-50/70 border border-butter-100 text-xs leading-relaxed space-y-3 text-ink/90"><p>"Conforme defende Paulo Freire, a educação é instrumento indispensável de emancipação. <span class="bg-mint-100 px-1.5 py-0.5 rounded-lg font-semibold text-mint-600">Contudo, no interior nordestino, a precariedade da banda larga amplia desigualdades no acesso à universidade.</span>"</p><p>"Portanto, cabe ao Ministério da Educação, por meio de parcerias com redes municipais, ampliar pontos de estudo offline..."</p></div><div class="p-4 rounded-2xl bg-lav-50 border border-lav-100 text-xs text-lav-700"><strong>Recado da corretora:</strong> Repertório impecável! Para bater 960+, detalhe quem fiscalizará a ação na C5.</div></div>
            </div>
          ` : `
            <div class="grid ${g2} gap-5">
              <div class="card-mlp p-5 space-y-3.5">
                <div class="p-3.5 rounded-2xl bg-rosesoft-50 border border-rosesoft-100 text-xs text-rosesoft-600 flex flex-wrap items-center justify-between gap-2"><span><strong>Tema:</strong> Democratização da preparação para o ENEM fora das capitais.</span><button onclick="carregarRedacaoExemplo()" class="px-3 py-1 rounded-full bg-white text-rosesoft-600 font-bold text-[11px] shadow-sm">Carregar exemplo</button></div>
                <textarea oninput="updateRedTexto(this.value)" rows="9" placeholder="Escreva sua redação aqui..." class="w-full rounded-2xl bg-canvas border border-slate-200 p-4 text-xs leading-relaxed">${STATE.redTexto}</textarea>
                <div class="flex flex-wrap items-center justify-between gap-2"><span id="word-cnt" class="text-xs font-semibold text-muted">${palavras} palavras · Banca em até 3 dias</span><button onclick="executarPreAvaliacao()" class="px-5 py-2.5 rounded-full bg-lav-600 text-white font-bold text-xs shadow-sm">Pré-Avaliar & Enviar</button></div>
              </div>
              <div class="card-mlp p-5 space-y-3">
                <h3 class="font-display font-bold text-sm text-ink">Resultado da Pré-Avaliação</h3>
                ${av ? `<div class="p-4 rounded-2xl bg-gradient-to-r from-lav-50 to-mint-50 flex items-center justify-between"><div><div class="text-[11px] font-bold text-muted">Nota Estimada</div><div class="text-xs text-mint-600 font-semibold">${av.palavras} palavras · ${av.paragrafos} parágrafos</div></div><div class="font-display font-extrabold text-3xl text-lav-700">${av.total}</div></div><div class="space-y-2">${av.comps.map(x => `<div class="p-2.5 rounded-2xl ${PASTEL_STYLES[x.cor].bg} text-xs"><div class="flex justify-between font-bold text-ink"><span>${x.c}</span><span>${x.n}/200</span></div><div class="text-[11px] text-ink/75 mt-0.5">${x.desc}</div></div>`).join('')}</div>` : `<div class="h-56 rounded-2xl bg-canvas flex flex-col items-center justify-center text-center p-6 text-xs text-muted space-y-2"><i data-lucide="feather" class="w-8 h-8 text-lav-500/50"></i><p>Escreva seu texto (ou clique em <strong>Carregar exemplo</strong>) e aperte <strong>Pré-Avaliar & Enviar</strong>.</p></div>`}
              </div>
            </div>
          `}
        </div>`;
    }

    // T08
    case 'T08': {
      return pill + `
        <div class="fade-up space-y-5">
          <div class="rounded-[28px] p-5 bg-gradient-to-r from-peach-50 via-butter-50 to-lav-50 border border-peach-100 flex flex-wrap items-center justify-between gap-3">
            <div><span class="px-2.5 py-0.5 rounded-full bg-white text-peach-600 text-[10px] font-bold shadow-sm">LIGA OURO · INTERIOR DA BAHIA</span><h2 class="font-display font-extrabold text-2xl text-ink mt-1.5">${STATE.xpTotal.toLocaleString('pt-BR')} XP · 14 dias seguidos 🔥</h2></div>
            <button onclick="abrirNovidades()" class="px-4 py-2.5 rounded-full bg-white text-lav-700 font-bold text-xs shadow-soft border border-lav-100 flex items-center gap-1.5"><i data-lucide="bell-ring" class="w-4 h-4 text-peach-500"></i> Novidades do Mês (LU-235)</button>
          </div>
          <div class="grid ${g2} gap-5">
            <div class="card-mlp p-5 space-y-3">
              <div class="flex justify-between items-center"><h3 class="font-display font-bold text-sm text-ink">Trilha · Matemática Fase 2</h3><span class="text-[11px] text-lav-600 font-bold">Toque na fase ativa!</span></div>
              ${STATE.trilhaNos.map(x => `<button onclick="clicarFaseTrilha(${x.n})" class="w-full p-3.5 rounded-2xl border flex items-center justify-between transition ${x.st==='done'?'bg-mint-50/70 border-mint-100':x.st==='atual'?'bg-lav-50 border-lav-300 shadow-sm':'bg-canvas border-transparent opacity-70'}"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-2xl flex items-center justify-center font-display font-extrabold text-xs ${x.st==='done'?'bg-mint-500 text-white':x.st==='atual'?'bg-lav-600 text-white':'bg-slate-200 text-muted'}">${x.st==='done'?'✓':x.n}</div><div class="text-left"><div class="text-xs font-bold text-ink">${x.tit}</div><div class="text-[11px] text-muted">+${x.xp} XP</div></div></div><span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-white text-ink shadow-sm">${x.st==='done'?'Concluída':x.st==='atual'?'▶ Jogar':'Bloqueada'}</span></button>`).join('')}
            </div>
            <div class="card-mlp p-5 space-y-2.5">
              <h3 class="font-display font-bold text-sm text-ink mb-1">Ranking das Escolas Parceiras</h3>
              ${ESCOLAS_BA.map((e, i) => `<div class="p-3 rounded-2xl bg-canvas flex items-center justify-between text-xs"><div class="flex items-center gap-2.5"><span class="w-7 h-7 rounded-full flex items-center justify-center font-display font-extrabold text-[11px] ${i===0?'bg-butter-100 text-butter-600':i===1?'bg-lav-100 text-lav-700':'bg-white text-muted'}">${i+1}º</span><span class="font-semibold text-ink">${e.nome}</span></div><span class="font-bold text-lav-600">${((5-i)*310 + 1240 + (i===0 ? STATE.xpTotal-1840 : 0)).toLocaleString('pt-BR')} pts</span></div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    // --------------------------------------------------------------------------
    // T09: TUTOR LUME IA (GEMINI AO VIVO + SUPER BASE ENEM)
    // --------------------------------------------------------------------------
    case 'T09': {
      return pill + `

function exportarContabil() {
  const linhas = ['semana,alcance,cadastros,ativados,ativos_semana,receita_rs,nps,chamados'];
  DATA.funil.forEach(f => linhas.push(`${f.sem},${f.alcance},${f.cadastros},${f.ativados},${f.ativos},${f.receita},${f.nps},${f.chamados}`));
  const blob = new Blob([linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'exportacao_contabil_lume_LU225.csv'; a.click();
  showToast('Exportação contábil baixada (LU-225)!');
}

setInterval(() => {
  if (STATE.playerPlaying && STATE.screen === 'T04') { STATE.playerSec++; render(); }
  if (STATE.simRunning && STATE.screen === 'T06') {
    STATE.simSec = Math.max(0, STATE.simSec - 1);
    const clk = document.getElementById('sim-clock');
    if (clk) {
      const h = String(Math.floor(STATE.simSec / 3600)).padStart(2, '0'), m = String(Math.floor((STATE.simSec % 3600) / 60)).padStart(2, '0'), s = String(STATE.simSec % 60).padStart(2, '0');
      clk.textContent = `${h}:${m}:${s}`;
    }
  }
}, 1000);
